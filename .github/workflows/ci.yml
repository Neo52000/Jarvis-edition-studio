name: Validation technique
# Tests only. No deployment, no publication, no secrets used.
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      JARVIS_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fonts and Postgres client
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core postgresql-client
      - run: python -m pip install -r requirements.txt
      - name: Python tests (export, generation, secrets hygiene, SQL RLS)
        run: python -m pytest tests -q
      - name: JavaScript syntax and unit tests
        run: |
          node --check web/app.js
          node --check web/util.js
          node --test tests/js/util.test.mjs
